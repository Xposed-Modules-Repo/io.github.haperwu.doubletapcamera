name: set-repo-meta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Set repository description, homepage and topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -x
          gh api --method PATCH "repos/${GH_REPO}" \
            -f description='双击电源键直开相机（ColorOS / 一加）' \
            -f homepage='https://github.com/HaperWu/doubletapcamera'
          gh api --method PUT "repos/${GH_REPO}/topics" \
            --input '{"names":["xposed","lsposed","coloros","oneplus","camera","system","power-button"]}'
          gh api "repos/${GH_REPO}" --jq '{description, homepage, topics}'
